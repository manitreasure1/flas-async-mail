[project]
name = "flask-async-mail"
version = "0.1.1"
description = "A Flask extension for sending emails with Celery"
authors = [
    {name = "manitreasure1",email = "manitreasure1@gmail.com"}
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "celery (>=5.4.0,<6.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "flask[async]>=3.1.3",
    "aiosmtplib>=5.1.3",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_nova/"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src/flask_nova"]

[project.urls]
Homepage = "https://github.com/manitreasure1/flas-async-mail"
Documentation = "https://github.com/manitreasure1.github.io/flask-async-mail"
Repository = "https://github.com/manitreasure1/flas-async-mail"
Issues = "https://github.com/manitreasure1/flas-async-mail/issues"

[tool.hatch.build.targets.sdist]
include = [
    "src/flask_async_mail",
    "README.md",
    "LICENSE",
]
